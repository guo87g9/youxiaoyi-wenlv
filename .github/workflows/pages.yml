name: Deploy demo to GitHub Pages

# 只发布 app/ 目录（静态前端），交付件（含 20MB 单文件版）不走 Pages
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 仓库里没有 config.js（含 key，已 gitignore），这里从 secret 生成
      # 未配置 secret 时写入空 key，页面自动降级为手绘示意地图，仍可正常浏览
      - name: Generate config.js
        run: |
          cp app/config.example.js app/config.js
          if [ -n "${{ secrets.TIANDITU_TK }}" ]; then
            sed -i 's|tk: ""|tk: "${{ secrets.TIANDITU_TK }}"|' app/config.js
            echo "已注入天地图 key"
          else
            echo "未配置 TIANDITU_TK，地图将降级为示意地图"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
